[package]
name = "updock"
version = "0.1.0"
edition = "2024"
description = "Harbor webhook daemon + Watchtower-style auto-updater – runs docker compose up -d and manages containers"
authors = []

[dependencies]
# HTTP server
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["trace"] }
hyper = { version = "1", features = ["full"] }

# Config / serialisation
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Logging / tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Async utilities
anyhow = "1"
thiserror = "1"
futures-util = "0.3"

# HMAC / secret validation
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"

# Daemonise
nix = { version = "0.29", features = ["process", "signal", "fs"] }

# Docker Engine API
bollard = { version = "0.17", features = ["ssl"] }

# Scheduling / cron
tokio-cron-scheduler = "0.11"
cron = "0.12"

# Notifications
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
lettre = { version = "0.11", features = ["tokio1", "tokio1-native-tls", "smtp-transport", "builder"], default-features = false }

# Prometheus metrics
prometheus = { version = "0.13", features = ["process"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# Misc
url = "2"

[dev-dependencies]
# HTTP test client for axum integration tests
axum-test = "15"
# Lightweight mock HTTP server for notification tests
wiremock = "0.6"
# Temporary files/dirs for config and daemon tests
tempfile = "3"
# tokio test macros
tokio = { version = "1", features = ["full"] }
